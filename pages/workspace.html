<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomáš Mojžiš - Workspace</title>
    <link rel="icon" type="image/jpeg" href="../img/pfp.jpg">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="workspace-page">
    <header>
        <h1><a href="../index.html"><img src="../img/pfp.jpg"><span>Tomáš Mojžiš</span><small class="header-subtitle">študent FEI</small></a></h1>
            <label class="hamburger">
                <input type="checkbox">
                <span aria-hidden="true">&#9776;</span>
            </label>
            <ul class="navbar">
            <li><a href="../index.html">Profil</a></li>
            <li><a href="cv.html">Životopis </a></li>
            <li><a href="map.html">Map</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="workspace.html" aria-current="page">Workspace</a></li>
            </ul>
    </header>

    <main>
    <h1>Môj workspace</h1>
    <h2 class="page-subtitle small-subtitle">Prejdi myšou po bodoch</h2>
    <figure class="hotspot-image">
      <img src="../img/setup1.jpg">

      <div class="hotspot" style="--x: 9%; --y: 84%">
        <button class="hotspot__dot" type="button" aria-label="Notebook"></button>
        <div class="hotspot__panel">
          <h2>Notebook</h2>
          <p>R7 7840HS RTX4060 16GB</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 21%; --y: 67%">
        <button class="hotspot__dot" type="button" aria-label="Monitor"></button>
        <div class="hotspot__panel">
          <h2>Monitor</h2>
          <p>32" 165hz IPS</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 44%; --y: 64%">
        <button class="hotspot__dot" type="button" aria-label="Počítač"></button>
        <div class="hotspot__panel">
          <h2>Stolný počítač</h2>
          <p>R7 5800X GTX970 32GB</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 28%; --y: 86%">
        <button class="hotspot__dot" type="button" aria-label="Klavesnica"></button>
        <div class="hotspot__panel">
          <h2>Klávesnica</h2>
          <p>HyperX Allow FPS</p>
        </div>
      </div>

      <div class="hotspot hotspot--left" style="--x: 80%; --y: 64%">
        <button class="hotspot__dot" type="button" aria-label="Telka"></button>
        <div class="hotspot__panel">
          <h2>Telka</h2>
          <p>Samsung 55"</p>
        </div>
      </div>
    </figure>
    </main>
    <footer>
        <address>
            <a href="mailto:xmojzist@stuba.sk">xmojzist@stuba.sk</a>
        </address>
        <p>2026 Tomáš Mojžiš</p>
        <p>Zdroje: <a href="https://leafletjs.com/">Leaflet</a>, <a href="https://www.openstreetmap.org/">OpenStreetMap</a></p>
    </footer>

</body>
</html>
